services:
  - type: web
    name: repolens-api
    runtime: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "120"
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
